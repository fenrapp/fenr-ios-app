        RideNavigationAppleMapsTests: [test]
        RideSessionTests: [test]
        VehicleSessionTests: [test]
        RideSessionDataTests: [test]
        DesignSystemTests: [test]
        MeasurementPresentationTests: [test]
        BikeDiagnosticsTests: [test]
        BikeOnboardingTests: [test]
        RideDashboardTests: [test]
        BatteryHealthTests: [test]
        AppSettingsTests: [test]
        DashboardCardSettingsTests: [test]
        BikeLockSettingsTests: [test]
        PowerModeSettingsTests: [test]
        RideHistoryTests: [test]
        TestSupportTests: [test]
        FENRTests: [test]
        FENRDebugTests: [test]
    test:
      targets:
        - StarkProtocolTests
        - BLETraceDataTests
        - BikeSDKTests
        - BikeDomainTests
        - BikeDataTests
        - BikeEmulatorTests
        - ChargeControlTests
        - SettingsDataTests
        - EnvironmentDataTests
        - RideSessionDomainTests
        - RideNavigationDomainTests
        - RideNavigationDataTests
        - RideNavigationTests
        - RideNavigationAppleMapsTests
        - RideSessionTests
        - VehicleSessionTests
        - RideSessionDataTests
        - DesignSystemTests
        - MeasurementPresentationTests
        - BikeDiagnosticsTests
        - BikeOnboardingTests
        - RideDashboardTests
        - BatteryHealthTests
        - AppSettingsTests
        - DashboardCardSettingsTests
        - BikeLockSettingsTests
        - PowerModeSettingsTests
        - RideHistoryTests
        - FENRTests
        - FENRDebugTests
  FENRDebug:
    management:
      shared: true
      orderHint: 1
      isShown: true
    build:
      targets:
        FENRDebug: all
        FENRDebugTests: [test]
    test:
      targets:
        - FENRDebugTests
    run:
      config: Debug
      commandLineArguments:
        "-skipOnboarding": true
  FENRWatch:
    management:
      shared: true
      orderHint: 2
      isShown: true
    build:
      targets:
        FENRWatch: all
  FENRWatchDebug:
    management:
      shared: true
      orderHint: 3
      isShown: true
    build:
      targets:
        FENRWatchDebug: all
        WatchDashboardTests: [test]
        WatchOnboardingTests: [test]
    test:
      targets:
        - WatchDashboardTests
        - WatchOnboardingTests
