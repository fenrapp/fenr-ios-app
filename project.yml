name: FENR
include:
  - path: config/xcodegen/templates.yml
    relativePaths: false
  - path: config/xcodegen/modules.yml
    relativePaths: false
  - path: config/xcodegen/features.yml
    relativePaths: false
  - path: config/xcodegen/apps.yml
    relativePaths: false
  - path: config/xcodegen/tests.yml
    relativePaths: false
  - path: config/xcodegen/schemes.yml
    relativePaths: false
options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
  developmentLanguage: en
  postGenCommand: python3 scripts/configure-routing-coverage.py
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
fileGroups:
  - docs/app-store
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
