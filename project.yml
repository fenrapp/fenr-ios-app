name: FENR
options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AsyncSupport:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/AsyncSupport/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.asyncsupport
  BLETraceDomain:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/BLETraceDomain/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.bletracedomain
  BLETraceData:
    type: framework
    platform: iOS
    sources:
      - path: Modules/BLETraceData/Sources
    dependencies:
      - target: AsyncSupport
      - target: BLETraceDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.bletracedata
  RuntimeConfiguration:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/RuntimeConfiguration/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.runtimeconfiguration
  StarkProtocol:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/StarkProtocol/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.protocol
  BikeSDK:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/BikeSDK/Sources
    dependencies:
      - target: AsyncSupport
      - target: BLETraceDomain
      - target: RuntimeConfiguration
      - target: StarkProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.bikesdk
  BikeDomain:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/BikeDomain/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.bikedomain
  BikeData:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/BikeData/Sources
    dependencies:
      - target: AsyncSupport
      - target: BikeDomain
      - target: BikeSDK
      - target: StarkProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.bikedata
  BikeEmulator:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/BikeEmulator/Sources
    dependencies:
      - target: AsyncSupport
      - target: BikeDomain
      - target: RuntimeConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.bikeemulator
  ChargeControl:
    type: framework
    platform: iOS
    sources:
      - path: Modules/ChargeControl/Sources
    dependencies:
      - target: BikeDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.chargecontrol
  EnvironmentDomain:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/EnvironmentDomain/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.environmentdomain
  EnvironmentData:
    type: framework
    platform: iOS
    sources:
      - path: Modules/EnvironmentData/Sources
    dependencies:
      - target: EnvironmentDomain
      - target: RuntimeConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.environmentdata
  RideSessionDomain:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RideSessionDomain/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.ridesessiondomain
  VehicleSession:
    type: framework
    platform: iOS
    sources:
      - path: Modules/VehicleSession/Sources
    dependencies:
      - target: BikeDomain
      - target: EnvironmentDomain
      - target: SettingsDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.vehiclesession
  RideSession:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RideSession/Sources
    dependencies:
      - target: BikeDomain
      - target: RideSessionDomain
      - target: SettingsDomain
      - target: VehicleSession
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.ridesession
  RideSessionData:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RideSessionData/Sources
    dependencies:
      - target: RideSessionDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.ridesessiondata
  RideNavigationDomain:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RideNavigationDomain/Sources
    dependencies:
      - target: EnvironmentDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.ridenavigationdomain
  RideNavigationData:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RideNavigationData/Sources
    dependencies:
      - target: EnvironmentDomain
      - target: RideNavigationDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.ridenavigationdata
  SettingsDomain:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/SettingsDomain/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.settingsdomain
  SettingsData:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/SettingsData/Sources
    dependencies:
      - target: SettingsDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.settingsdata
  DesignSystem:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/DesignSystem/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.designsystem
  MeasurementPresentation:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/MeasurementPresentation/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.measurementpresentation
  TestSupport:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Modules/TestSupport/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.testsupport
  BikeDiagnostics:
    type: framework
    platform: iOS
    sources:
      - path: Features/BikeDiagnostics/Sources
    dependencies:
      - target: AsyncSupport
      - target: BLETraceDomain
      - target: BikeDomain
      - target: SettingsDomain
      - target: DesignSystem
      - target: MeasurementPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.diagnostics
  BikeOnboarding:
    type: framework
    platform: iOS
    sources:
      - path: Features/BikeOnboarding/Sources
    dependencies:
      - target: BikeDomain
      - target: StarkProtocol
      - target: DesignSystem
      - target: RuntimeConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.onboarding
  RideDashboard:
    type: framework
    platform: iOS
    sources:
      - path: Features/RideDashboard/Sources
    dependencies:
      - target: BikeDomain
      - target: EnvironmentDomain
      - target: RideSession
      - target: RideSessionDomain
      - target: VehicleSession
      - target: SettingsDomain
      - target: DesignSystem
      - target: MeasurementPresentation
      - target: RuntimeConfiguration
      - target: ChargeControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.dashboard
  BatteryHealth:
    type: framework
    platform: iOS
    sources:
      - path: Features/BatteryHealth/Sources
    dependencies:
      - target: BikeDomain
      - target: SettingsDomain
      - target: DesignSystem
      - target: MeasurementPresentation
      - target: RuntimeConfiguration
      - target: ChargeControl
      - target: VehicleSession
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.batteryhealth
  AppSettings:
    type: framework
    platform: auto
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: Features/AppSettings/Sources
    dependencies:
      - target: BikeDomain
      - target: SettingsDomain
      - target: EnvironmentDomain
      - target: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.appsettings
  DashboardCardSettings:
    type: framework
    platform: iOS
    sources:
      - path: Features/DashboardCardSettings/Sources
    dependencies:
      - target: BikeDomain
      - target: SettingsDomain
      - target: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.dashboardcardsettings
  BikeLockSettings:
    type: framework
    platform: iOS
    sources:
      - path: Features/BikeLockSettings/Sources
    dependencies:
      - target: BikeDomain
      - target: SettingsDomain
      - target: VehicleSession
      - target: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.bikelocksettings
  PowerModeSettings:
    type: framework
    platform: iOS
    sources:
      - path: Features/PowerModeSettings/Sources
    dependencies:
      - target: BikeDomain
      - target: SettingsDomain
      - target: VehicleSession
      - target: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.powermodesettings
  RideHistory:
    type: framework
    platform: iOS
    sources:
      - path: Features/RideHistory/Sources
    dependencies:
      - target: RideSession
      - target: RideSessionDomain
      - target: SettingsDomain
      - target: DesignSystem
      - target: MeasurementPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.ridehistory
  RideNavigation:
    type: framework
    platform: iOS
    sources:
      - path: Features/RideNavigation/Sources
    dependencies:
      - target: EnvironmentDomain
      - target: RideNavigationDomain
      - target: SettingsDomain
      - target: VehicleSession
      - target: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.ridenavigation
  RideNavigationAppleMaps:
    type: framework
    platform: iOS
    sources:
      - path: Modules/RideNavigationAppleMaps/Sources
    dependencies:
      - target: EnvironmentDomain
      - target: RideNavigationDomain
      - target: RideNavigation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.ridenavigationapplemaps
  WatchDashboard:
    type: framework
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Features/WatchDashboard/Sources
    dependencies:
      - target: BikeDomain
      - target: DesignSystem
      - target: MeasurementPresentation
      - target: SettingsDomain
      - target: RuntimeConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.watchdashboard
  WatchOnboarding:
    type: framework
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Features/WatchOnboarding/Sources
    dependencies:
      - target: BikeDomain
      - target: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.watchonboarding
  FENR:
    type: application
    platform: iOS
    info:
      path: App/Generated/FENR-Info.plist
      properties:
        NSSupportsLiveActivities: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.fenr.app.navigation
            CFBundleURLSchemes:
              - fenr-app
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.topografix.gpx
          - CFBundleTypeName: Apple Maps directions request
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.maps.directionsrequest
        MKDirectionsApplicationSupportedModes:
          - MKDirectionsModeCar
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: App/Sources
      - path: App/Resources
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if command -v swiftlint >/dev/null; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml"
          elif [ -x "$HOME/.local/share/mise/installs/swiftlint/latest/swiftlint" ]; then
            "$HOME/.local/share/mise/installs/swiftlint/latest/swiftlint" lint --config "${SRCROOT}/.swiftlint.yml"
          elif [ -x "/opt/homebrew/bin/swiftlint" ]; then
            "/opt/homebrew/bin/swiftlint" lint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed. Install with: brew install swiftlint"
          fi
    dependencies:
      # DesignSystem is embedded for feature frameworks at runtime; the app does not import it.
      - target: DesignSystem
        embed: true
      # AsyncSupport is loaded by BikeSDK, BikeData, and BikeDiagnostics at runtime.
      - target: AsyncSupport
        embed: true
      - target: BLETraceDomain
        embed: true
      - target: BLETraceData
        embed: true
      - target: BikeDiagnostics
      - target: BikeOnboarding
      - target: RideDashboard
      - target: MeasurementPresentation
        embed: true
      - target: BatteryHealth
      - target: ChargeControl
      - target: AppSettings
      - target: DashboardCardSettings
      - target: BikeLockSettings
      - target: PowerModeSettings
      - target: RideHistory
      - target: RideNavigation
      - target: RideNavigationAppleMaps
      - target: RideNavigationData
      - target: RideNavigationDomain
      - target: BikeData
      - target: EnvironmentDomain
      - target: EnvironmentData
      - target: RideSession
      - target: VehicleSession
      - target: RideSessionDomain
      - target: RideSessionData
      - target: SettingsDomain
      - target: SettingsData
      - target: BikeDomain
      - target: BikeSDK
      - target: StarkProtocol
      - target: RuntimeConfiguration
      - target: ChargingLiveActivityExtension
        embed: true
      - target: FENRShareExtension
        embed: true
    settings:
      base:
        INFOPLIST_KEY_NSFaceIDUsageDescription: "FENR uses Face ID to authorize unlocking your motorcycle."
        PRODUCT_BUNDLE_IDENTIFIER: in.fenr.app
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: FENR
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: FENR uses Bluetooth to authenticate with your Stark Varg and display telemetry.
        INFOPLIST_KEY_NSCameraUsageDescription: FENR uses the camera to scan your bike VIN during setup.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: FENR uses your location for GPS speed, ride recording, and route navigation.
        CODE_SIGN_ENTITLEMENTS: App/FENR.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  FENRDebug:
    type: application
    platform: iOS
    info:
      path: App/Generated/FENRDebug-Info.plist
      properties:
        NSSupportsLiveActivities: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.fenr.app.navigation
            CFBundleURLSchemes:
              - fenr-app
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.topografix.gpx
          - CFBundleTypeName: Apple Maps directions request
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.maps.directionsrequest
        MKDirectionsApplicationSupportedModes:
          - MKDirectionsModeCar
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: App/Sources
        excludes:
          - FENRApp.swift
          - Composition/BikeData
          - Composition/BikeSDK
          - Composition/StarkProtocol
          - Composition/Production
      - path: App/DebugSources
      - path: App/Resources
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if command -v swiftlint >/dev/null; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml"
          elif [ -x "$HOME/.local/share/mise/installs/swiftlint/latest/swiftlint" ]; then
            "$HOME/.local/share/mise/installs/swiftlint/latest/swiftlint" lint --config "${SRCROOT}/.swiftlint.yml"
          elif [ -x "/opt/homebrew/bin/swiftlint" ]; then
            "/opt/homebrew/bin/swiftlint" lint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed. Install with: brew install swiftlint"
          fi
    dependencies:
      # DesignSystem is embedded for feature frameworks at runtime; the app does not import it.
      - target: DesignSystem
        embed: true
      # AsyncSupport is loaded by BikeEmulator and BikeDiagnostics at runtime.
      - target: AsyncSupport
        embed: true
      - target: BLETraceDomain
        embed: true
      - target: BLETraceData
        embed: true
      # BikeOnboarding loads StarkProtocol at runtime; the app does not import it.
      - target: StarkProtocol
        embed: true
      - target: BikeDiagnostics
      - target: BikeOnboarding
      - target: RideDashboard
      - target: MeasurementPresentation
        embed: true
      - target: BatteryHealth
      - target: ChargeControl
      - target: AppSettings
      - target: DashboardCardSettings
      - target: BikeLockSettings
      - target: PowerModeSettings
      - target: RideHistory
      - target: RideNavigation
      - target: RideNavigationAppleMaps
      - target: RideNavigationData
      - target: RideNavigationDomain
      - target: BikeDomain
      - target: EnvironmentDomain
      - target: EnvironmentData
      - target: RideSession
      - target: VehicleSession
      - target: RideSessionDomain
      - target: RideSessionData
      - target: SettingsDomain
      - target: SettingsData
      - target: RuntimeConfiguration
      - target: BikeEmulator
      - target: ChargingLiveActivityDebugExtension
        embed: true
      - target: FENRDebugShareExtension
        embed: true
    settings:
      base:
        INFOPLIST_KEY_NSFaceIDUsageDescription: "FENR uses Face ID to authorize unlocking your motorcycle."
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.app.debug
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: FENR Debug
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSCameraUsageDescription: FENR uses the camera to scan your bike VIN during setup.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: FENR uses your location for GPS speed, ride recording, and route navigation.
        CODE_SIGN_ENTITLEMENTS: App/FENRDebug.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ChargingLiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LiveActivityExtension/Sources
      - path: App/Sources/Composition/LiveActivity/BikeLiveActivityAttributes.swift
    dependencies:
      - target: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.fenr.app.charging-live-activity
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LiveActivityExtension/Info.plist
  ChargingLiveActivityDebugExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LiveActivityExtension/Sources
      - path: App/Sources/Composition/LiveActivity/BikeLiveActivityAttributes.swift
    dependencies:
      - target: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.app.debug.charging-live-activity
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LiveActivityExtension/Info.plist
  FENRShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension/Sources
    dependencies:
      - target: RideNavigationData
      - target: RideNavigationDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.fenr.app.share
        PRODUCT_NAME: Open in FENR
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/FENRShare.entitlements
        SKIP_INSTALL: YES
  FENRDebugShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension/Sources
    dependencies:
      - target: RideNavigationData
      - target: RideNavigationDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.app.debug.share
        PRODUCT_NAME: Open in FENR Debug
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/FENRDebugShare.entitlements
        SKIP_INSTALL: YES
  FENRWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    info:
      path: Watch/Generated/FENRWatch-Info.plist
      properties:
        UIBackgroundModes:
          - bluetooth-central
    sources:
      - path: Watch/Sources
    dependencies:
      - target: AsyncSupport
        embed: true
      - target: BLETraceDomain
        embed: true
      - target: StarkProtocol
        embed: true
      - target: BikeSDK
        embed: true
      - target: BikeDomain
        embed: true
      - target: BikeData
        embed: true
      - target: WatchDashboard
        embed: true
      - target: WatchOnboarding
        embed: true
      - target: AppSettings
        embed: true
      - target: SettingsDomain
        embed: true
      - target: SettingsData
        embed: true
      - target: EnvironmentDomain
        embed: true
      - target: DesignSystem
        embed: true
      - target: MeasurementPresentation
        embed: true
      - target: RuntimeConfiguration
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.watch
        INFOPLIST_KEY_CFBundleDisplayName: FENR
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: FENR uses Bluetooth to connect directly to your bike and show live telemetry.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  FENRWatchDebug:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/Sources
        excludes:
          - App/FENRWatchApp.swift
          - Composition/Production/LiveWatchAppDependencyContainerFactory.swift
      - path: Watch/DebugSources
    dependencies:
      - target: AsyncSupport
        embed: true
      - target: BikeDomain
        embed: true
      - target: BikeEmulator
        embed: true
      - target: WatchDashboard
        embed: true
      - target: WatchOnboarding
        embed: true
      - target: AppSettings
        embed: true
      - target: SettingsDomain
        embed: true
      - target: SettingsData
        embed: true
      - target: EnvironmentDomain
        embed: true
      - target: DesignSystem
        embed: true
      - target: MeasurementPresentation
        embed: true
      - target: RuntimeConfiguration
        embed: true
