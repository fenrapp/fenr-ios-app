  FENRDebugTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/DebugTests
      - path: App/DebugSources
        excludes:
          - FENRDebugApp.swift
          - DebugScenarioPicker.swift
      - path: App/Sources/Composition
        excludes:
          - BikeData
          - BikeSDK
          - StarkProtocol
          - Production
    dependencies:
      - target: AppSettings
      - target: BikeDiagnostics
      - target: BikeOnboarding
      - target: RideDashboard
      - target: BatteryHealth
      - target: BikeDomain
      - target: BikeEmulator
      - target: EnvironmentDomain
      - target: EnvironmentData
      - target: SettingsDomain
      - target: SettingsData
      - target: RuntimeConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fenr.app.debug.tests
schemes:
  FENR:
    management:
      shared: true
      orderHint: 0
      isShown: true
    build:
      targets:
        FENR: all
        StarkProtocolTests: [test]
        AsyncSupportTests: [test]
        BikeSDKTests: [test]
        BikeDomainTests: [test]
        BikeDataTests: [test]
        BikeEmulatorTests: [test]
        ChargeControlTests: [test]
        SettingsDataTests: [test]
        DesignSystemTests: [test]
        MeasurementPresentationTests: [test]
        BikeDiagnosticsTests: [test]
        BikeOnboardingTests: [test]
        RideDashboardTests: [test]
        BatteryHealthTests: [test]
        AppSettingsTests: [test]
        TestSupportTests: [test]
        FENRTests: [test]
        FENRDebugTests: [test]
    test:
      targets:
        - StarkProtocolTests
        - BikeSDKTests
        - BikeDomainTests
        - BikeDataTests
        - BikeEmulatorTests
        - ChargeControlTests
        - SettingsDataTests
        - DesignSystemTests
        - MeasurementPresentationTests
