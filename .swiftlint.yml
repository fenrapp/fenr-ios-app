included:
  - App
  - Features
  - LiveActivityExtension
  - Modules
  - ShareExtension
  - Watch

excluded:
  - FENR.xcodeproj
  - svag-mini
  - svag-telemetry-format
  - stark-varg-garmin-bridge

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 250
  error: 400

disabled_rules:
  - file_length

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 5
  error: 7

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 3
  excluded:
    - ex
    - id
    - mx
    - on
    - sm

type_name:
  max_length:
    warning: 50
    error: 60

nesting:
  type_level:
    warning: 2

reporter: xcode

custom_rules:
  production_file_length:
    included: ".*\\.swift"
    excluded: ".*/Tests/.*"
    name: "Production File Length"
    regex: "(?s)\\A(?:[^\\n]*\\n){350}."
    message: "Production Swift files must not exceed 350 physical lines."
    severity: error
  test_double_location:
    included: ".*Tests/.*"
    excluded: ".*Tests/TestDoubles/.*"
    name: "Test Double Location"
    regex: "(?m)^(?:private\\s+)?(?:actor|class|struct|enum)\\s+(?:Fake|Mock|Spy|Stub)\\w*"
    message: "Place test doubles in the target's Tests/TestDoubles directory."
    severity: error
